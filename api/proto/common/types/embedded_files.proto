/*
 * embedded_files.proto
 * Includes types for embedded files in KiCad documents
 */

syntax = "proto3";

package kiapi.common.types;

// Corresponds to EMBEDDED_FILE::FILE_TYPE
enum EmbeddedFileType
{
  EFT_UNKNOWN     = 0;
  EFT_OTHER       = 1;
  EFT_FONT         = 2;
  EFT_MODEL        = 3;
  EFT_WORKSHEET    = 4;
  EFT_DATASHEET    = 5;
}

// A file embedded in a KiCad document
message EmbeddedFile
{
  string name = 1;
  EmbeddedFileType type = 2;

  // zstd-compressed payload, base64-encoded.
  bytes data = 3;

  // MurmurHash3 integrity hash
  string data_hash = 4;
}

message EmbeddedFiles
{
  repeated EmbeddedFile files = 1;
}
