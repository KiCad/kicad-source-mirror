/*
 * variants.proto
 * Types describing design variants, shared by schematic, board, and project
 */

syntax = "proto3";

package kiapi.common.types;

// One design variant in a project
message DesignVariant
{
  // Variant name (must be case-insensitively unique in a project)
  // The default (base) variant has no name
  string name = 1;

  // The default variant is addressed by the empty string
  string description = 2;
}
