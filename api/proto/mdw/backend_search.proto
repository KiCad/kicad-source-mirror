/*
 * Capability group CG_SEARCH.
 *
 * Backend-declared search fields and paged item search. Empty text with no
 * filters returns every item, most recently changed first.
 */

syntax = "proto3";

package kiapi.mdw;

import "mdw/backend_base.proto";
import "workspace/workspace_types.proto";

message GetSearchSchemaRequest {}
message GetSearchSchemaReply { repeated kiapi.workspace.SearchField fields = 1; }

message SearchRequest
{
  string                                text    = 1;
  repeated kiapi.workspace.SearchFilter filters = 2;
  PageRequest                           page    = 3;
}

message SearchReply
{
  repeated kiapi.workspace.ItemInfo items           = 1;
  string                            next_page_token = 2;
  optional uint64                   total_count     = 3; // Unset when the backend cannot count cheaply
}
