/*
 * Capability group CG_BOM.
 *
 * A backend's bill of materials for a design, for comparison with the placed
 * parts. This group only reads.
 */

syntax = "proto3";

package kiapi.mdw;

import "workspace/workspace_types.proto";

message BomLine
{
  kiapi.workspace.ItemRef part        = 1; // A CG_PARTS part; may name another source
  string                  part_number = 2;
  repeated string         references  = 3; // Designators; may be empty
  double                  quantity    = 4;
  string                  unit        = 5; // Empty means pieces
}

message Bom
{
  string           bom_id       = 1;
  string           bom_type     = 2; // Backend display string
  string           label        = 3;
  int64            updated_unix = 4;
  string           updated_by   = 5;
  repeated BomLine lines        = 6;
}

// An item without a BOM answers WE_ITEM_NOT_FOUND
message GetBomRequest
{
  string item_id     = 1; // The project item
  string revision_id = 2;
}

message GetBomReply { Bom bom = 1; }
