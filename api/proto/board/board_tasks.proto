/*
 * Long-running asynchronous tasks on a board (zone fill, DRC).
 */

syntax = "proto3";

package kiapi.board.tasks;

import "common/types/base_types.proto";
import "common/tasks.proto";

// Refills some or all zones on the board as a background task.  Returns a StartTaskResponse immediately;
// poll GetTaskStatus with the returned token to determine when it has completed.
// For blocking behavior, use the pre-existing RefillZones command.
// Since: 11.0
message StartRefillZonesTask
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // A list of zones to refill.  If empty, all zones are refilled.
  repeated kiapi.common.types.KIID zones = 2;
}
