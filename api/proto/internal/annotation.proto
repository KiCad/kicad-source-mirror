// Private cross-editor messages used by forward and back annotation.
// kiapi.internal messages do not follow API stability guarantees.

syntax = "proto3";

package kiapi.internal;

import "common/types/base_types.proto";


message GenerateNetlistRequest
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message GenerateNetlistResponse
{
  bool success = 1;
  string netlist = 2;
  string report = 3;
}

message RelinkFootprintsRequest
{
  kiapi.common.types.DocumentSpecifier board = 1;
  string schematic_netlist = 2;
}

message RelinkFootprintsResponse
{
  bool success = 1;
  uint32 error_count = 2;
  uint32 warning_count = 3;
  string report = 4;
}
